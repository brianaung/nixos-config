[theme]
theme = "gruvbox-dark"

[[block]]
block = "net"
format = " $ssid $signal_strength D:$speed_down.eng(prefix:K) U:$speed_up.eng(prefix:K) "
[block.theme_overrides]
idle_bg = "#504945"

[[block]]
block = "cpu"
info_cpu = 20
warning_cpu = 50
critical_cpu = 90
[block.theme_overrides]
idle_bg = "#3c3836"

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = " $icon root: $available.eng(w:2) "
[block.theme_overrides]
idle_bg = "#3c3836"

[[block]]
block = "memory"
format = " $icon $mem_total_used_percents.eng(w:2) "
format_alt = " $icon_swap $swap_used_percents.eng(w:2) "
[block.theme_overrides]
idle_bg = "#3c3836"

[[block]]
block = "battery"

[[block]]
block = "sound"

[[block]]
block = "time"
interval = 60
format = " $timestamp.datetime(f:'%a %d/%m %R') "
[block.theme_overrides]
idle_bg = "#1d2021"
